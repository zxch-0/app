name: Build Windows MSI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex: 1.2.0). Vide = version actuelle de package.json'
        required: false
        default: ''
      publish:
        description: 'Creer une release GitHub avec l''installeur'
        type: choice
        options:
          - oui
          - non
        default: oui

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construire l'installeur
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnostic
        shell: pwsh
        run: |
          "node     : $(node --version)"
          "npm      : $(npm --version)"
          "runner   : ${{ runner.os }} ${{ runner.arch }}"

      - name: Cache Electron et npm
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/npm-cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-node22-electron-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-electron-

      - name: Installer les dependances
        run: npm install --no-audit --no-fund

      - name: Determiner la version
        id: meta
        shell: pwsh
        run: node scripts/ci-prepare.js "${{ github.event.inputs.version }}"

      - name: Generer l'icone
        shell: pwsh
        run: |
          node scripts/make-icon.js
          foreach ($f in @('build/icon.png', 'build/icon.ico')) {
            if (-not (Test-Path $f)) { throw "Icone manquante : $f" }
            "{0} ({1:N1} Ko)" -f $f, ((Get-Item $f).Length / 1KB)
          }

      - name: Nettoyer les anciens artefacts
        shell: pwsh
        run: |
          if (Test-Path release) { Remove-Item release -Recurse -Force }
          New-Item -ItemType Directory -Path release -Force | Out-Null

      - name: Construire l'installeur
        id: build
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          npm run dist:ci
          if ($LASTEXITCODE -eq 0) {
            "target=msi" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host '::warning::Build MSI en echec, repli sur NSIS (.exe)'
            npm run dist:exe
            if ($LASTEXITCODE -ne 0) { throw 'Les deux builds ont echoue' }
            "target=nsis" >> $env:GITHUB_OUTPUT
          }

      - name: Lister les livrables
        id: collect
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem -Path release -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in '.msi', '.exe' } |
              Sort-Object Name
          )

          if ($files.Count -eq 0) {
            throw 'Aucun installeur genere dans release/ (ni .msi ni .exe)'
          }

          $files | ForEach-Object { "{0} ({1:N1} Mo)" -f $_.Name, ($_.Length / 1MB) }

          Add-Content -Path $env:GITHUB_OUTPUT -Value 'files<<ORBRUSH_EOF' -Encoding utf8
          $files | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_.FullName -Encoding utf8 }
          Add-Content -Path $env:GITHUB_OUTPUT -Value 'ORBRUSH_EOF' -Encoding utf8

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: OrbRush-${{ steps.meta.outputs.version }}-installer
          path: ${{ steps.collect.outputs.files }}
          if-no-files-found: error
          retention-days: 30

      - name: Creer la release GitHub
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: OrbRush ${{ steps.meta.outputs.version }}
          files: ${{ steps.collect.outputs.files }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false

      - name: Resume
        shell: pwsh
        run: |
          "Version   : ${{ steps.meta.outputs.version }}"
          "Cible     : ${{ steps.build.outputs.target }}"
          "Livrables :"
          ${{ steps.collect.outputs.files }} | ForEach-Object { "  - $_" }
          "Release   : ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.tag }}"
